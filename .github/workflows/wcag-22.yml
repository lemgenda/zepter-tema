name: WCAG 2.2 checks

on:
  push:
    branches:
      - wcag-22
  pull_request:
    branches:
      - wcag-22
  workflow_dispatch:
    inputs:
      preview_url:
        description: Shopify preview URL for the WCAG remediation theme
        required: false
        default: 'https://hyperlightoptics.com/?_ab=0&_fd=0&_sc=1&preview_theme_id=191401984329'
        type: string
      paths:
        description: Comma-separated paths to test (defaults to home, product, two collections, FAQ, contact, login, account, cart, and search)
        required: false
        type: string

concurrency:
  group: wcag-22-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  theme-check:
    name: Liquid, JSON, and theme lint
    runs-on: ubuntu-26.04
    steps:
      - name: Check out theme
        uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Shopify Theme Check
        run: gem install theme-check
      # Shopify Theme Check's auto-correct mode applies only supported, deterministic
      # fixes. Commit those changes on the remediation branch, then dispatch a fresh
      # run so browser and lint checks execute against the exact corrected commit.
      - name: Apply and commit automatic Theme Check corrections
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/wcag-22'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          theme-check --auto-correct .
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No additional automatic Theme Check corrections were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply automatic Theme Check corrections"
          git push origin HEAD:wcag-22
          curl --fail --silent --show-error \\
            -X POST \\
            -H "Accept: application/vnd.github+json" \\
            -H "Authorization: Bearer ${GH_TOKEN}" \\
            -H "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/wcag-22.yml/dispatches" \\
            -d '{"ref":"wcag-22"}'
      - name: Run Shopify Theme Check
        run: theme-check --fail-level error .
      - name: Validate all JSON files
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';

          async function walk(directory) {
            const entries = await readdir(directory, { withFileTypes: true });
            for (const entry of entries) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const path = join(directory, entry.name);
              if (entry.isDirectory()) await walk(path);
              else if (entry.isFile() && path.endsWith('.json')) {
                try {
                  // Some Shopify-exported JSON files have a leading
                  // block-comment banner. Strip only leading comments
                  // before validating the actual JSON payload.
                  let source = (await readFile(path, 'utf8')).replace(/^\uFEFF/, '').trimStart();
                  while (source.startsWith('/*')) {
                    const commentEnd = source.indexOf('*/');
                    if (commentEnd === -1) break;
                    source = source.slice(commentEnd + 2).trimStart();
                  }
                  JSON.parse(source);
                } catch (error) {
                  console.error(path + ': ' + error.message);
                  process.exitCode = 1;
                }
              }
            }
          }

          await walk('.');
          if (!process.exitCode) console.log('All JSON files are valid.');
          NODE

  browser-accessibility:
    name: Browser accessibility smoke tests
    runs-on: ubuntu-26.04
    steps:
      - name: Check out test harness
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: npm install --no-save playwright @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run axe, keyboard focus, target-size review, and text-spacing smoke tests
        env:
          WCAG_TEST_PATHS: ${{ inputs.paths || '' }}
          WCAG_PREVIEW_URL: ${{ inputs.preview_url || 'https://hyperlightoptics.com/?_ab=0&_fd=0&_sc=1&preview_theme_id=191401984329' }}
        run: node scripts/wcag-a11y-smoke.mjs "$WCAG_PREVIEW_URL"
